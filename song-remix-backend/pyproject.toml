[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not real_engine'"
markers = [
    "real_engine: talks to a running ACE-Step on 127.0.0.1:8001 (opt in with -m real_engine)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
