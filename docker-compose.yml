services:
  frontend:
    build: ./song-remix-ui
    ports: ["5173:80"]
    depends_on: [backend]

  backend:
    build: ./song-remix-backend
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: remix_studio
      POSTGRES_USER: remix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remix -d remix_studio"]
      interval: 5s
      timeout: 3s
      retries: 5

  acestep:
    build:
      context: ./acestep
      dockerfile: Dockerfile
    ports: ["8001:8001"]
    volumes:
      - ./data/uploads:/app/uploads
      - acestep-cache:/root/.cache/huggingface
    profiles: ["acestep"]

  suno-api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      - SUNO_COOKIE=${SUNO_COOKIE}
      - TWOCAPTCHA_KEY=${TWOCAPTCHA_KEY}
    volumes:
      - ./suno-api:/app
    profiles: ["suno"]

volumes:
  pgdata:
  acestep-cache:
