name: audio-remix-lab

services:
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: remix_studio
      POSTGRES_USER: remix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remix -d remix_studio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
